services:
  - type: web
    name: retinawatch-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && python bootstrap.py
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
